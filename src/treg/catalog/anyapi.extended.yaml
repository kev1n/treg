# anyapi - EXTENDED tier: the provider's full endpoint surface, machine-generated by
# scripts/catalog_ingest.py. Do not hand-edit; re-run the script instead. Entries start with
# no capability, no verification and no example response - verification stamps and reviewed
# `capability` mappings (with their platform correction) are added later and carried across
# re-ingests by id via carry_verification. Routes curated in core anyapi.yaml are excluded here.
# Every SKU AnyAPI publishes, minus the routes curated in anyapi.yaml and the SKUs AnyAPI
# excludes from this listing (ANYAPI_EXCLUDE in scripts/catalog_ingest.py).
# Prices are the CHEAPEST source's customer price from the live rate card; every response
# reports its exact charge as costUsd, which is what reported_charge settles on.

provider: anyapi
source:
  method: openapi + provider rate card
  ingested: '2026-09-08'
  spec_urls:
  - https://api.getanyapi.com/openapi.json
  - https://api.getanyapi.com/v1/apis?limit=1000
endpoints:
- id: anyapi.chatgpt.search
  tier: extended
  platform: ai-search
  domain: search
  method: POST
  path: /v1/run/chatgpt.search
  name: ChatGPT Search
  summary: Ask ChatGPT a web-grounded question and receive an answer with source citations. ChatGPT composes each answer per request, so the same prompt returns different wording and a different source set.
  input:
    body:
      country:
        type: string
        required: false
        note: ISO-3166 alpha-2 country to ask from, e.g. US, GB, DE. ChatGPT localizes both the pages it retrieves and the answer it writes, so this is the difference between what a US buyer and a UK buyer are told.
        default: US
      prompt:
        type: string
        required: true
        note: Question or research prompt for ChatGPT to answer using web search.
        example: What is AnyAPI at getanyapi.com, and what does it offer?
      webSearch:
        type: string
        required: false
        note: Whether to insist ChatGPT browses the web. force instructs it to search and is the default; auto lets ChatGPT decide, which is cheaper and answers from memory roughly half the time. Check webSearchTriggered for what actually happened - an answer written without a search is not web-grounded.
        default: force
        enum:
        - force
        - auto
    bodyType: json
  cost:
    type: per_success
    value: 0.0018
    currency: USD
    unit: call
    reported_charge:
      path: costUsd
      unit: usd
    source: rate_card_api
    source_url: https://api.getanyapi.com/v1/apis/chatgpt.search
    checked: '2026-09-08'
    confidence: verified
  docs_url: https://getanyapi.com/api/chatgpt/search
  note: AnyAPI slug `chatgpt.search`. 3 sources can serve it; the cheapest serves first and a failed attempt is retried on the next, up to a $0.004 ceiling per request. `costUsd` on the response is the exact charge, which is what reported_charge settles. Send `max_cost_usd` to refuse any source dearer than a price you name.
