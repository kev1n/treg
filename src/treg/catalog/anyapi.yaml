# AnyAPI — CORE tier, hand-curated by the vendor (see the PR description's self-verification
# ledger: every test_request below was run live on 2026-09-08 and its cost reconciled against the
# charge AnyAPI's own meter reported).
#
# AnyAPI is a per-request USD gateway over 362 normalized endpoints. Two properties matter for
# this catalog:
#   1. PRICE. `cost.value` is the CHEAPEST source's customer price, read from AnyAPI's own live
#      rate card (GET /v1/apis/<sku>), which is why `source: rate_card_api`. Every SKU also
#      publishes `failoverMaxUsd`, the dearest source that may rescue a failed attempt; that
#      ceiling is named per endpoint in `note`.
#   2. SETTLEMENT. Every 2xx run body carries a top-level `costUsd` — the exact USD charged for
#      that call. `cost.reported_charge` makes treg settle on that number instead of the estimate,
#      so a rescued request bills what it really cost and a cheap request can bill LESS than the
#      catalogued price.
# A request that no source could serve returns a non-2xx and is not charged.
provider: anyapi
source:
  docs: https://getanyapi.com/docs
  openapi: https://api.getanyapi.com/openapi.json
  rate_card: https://api.getanyapi.com/v1/apis
  curated: '2026-09-08'
limits: no published per-key request-rate limit on /v1/run - AnyAPI does not advertise a quota it does
  not enforce. Spend is bounded instead by the wallet balance, the key's own spend cap, and the per-request
  `max_cost_usd` ceiling the caller sets. The unauthenticated /agent/signup trial route is limited to
  3 per IP per hour.
pricing_url: https://getanyapi.com/catalog
proposed_capabilities:
  web.contents.get: Get a page's text, highlights or summary by URL
endpoints:
- id: anyapi.google.serp.organic
  capability: google.serp.organic
  platform: google
  scope: any_account
  kind: data
  method: POST
  path: /v1/run/google.search
  name: Google Search
  summary: Run a Google web search and get the organic results (title, link, snippet, position) as clean
    JSON. Returns about 10 results per call - Google stopped honoring bulk result counts in September
    2025, so a limit above 10 is accepted but returns no more than a page. Pass the returned nextCursor
    back as cursor to walk further, or use google.search_100 for up to 100 ranked results in one call,
    which is cheaper past roughly 20 results.
  input:
    body:
      autocorrect:
        type: boolean
        required: false
        note: Toggle Google spelling autocorrect (default true). Set false to search the exact query without
          correction.
      cursor:
        type: string
        required: false
        note: Continuation token from a previous response's nextCursor. Pass it back to fetch the next
          page of results.
      gl:
        type: string
        required: false
        note: Two-letter country code for result localization (e.g. us, gb, de).
        default: us
        example: us
      hl:
        type: string
        required: false
        note: Two-letter interface and results language code (e.g. en, es, de).
        default: en
        example: en
      limit:
        type: integer
        required: false
        note: Maximum number of organic results to return in this response. Google stopped honoring bulk
          result counts in September 2025, so one page is about 10 results and a limit above 10 is accepted
          but will not return more than that. To go deeper, either page through with cursor (about 10
          results per...
        default: 10
        min: 1
        max: 100
        example: 1
      location:
        type: string
        required: false
        note: Fine-grained location for result localization, given as a canonical Google location string
          (e.g. 'New York, United States', 'London, United Kingdom'). More specific than the country-level
          gl.
      query:
        type: string
        required: true
        note: The Google search query.
        example: best coffee maker
      timeframe:
        type: string
        required: false
        note: 'Restrict results to a recent time window: 1h, 1d, 7d, 1y, or all. Default all (no time
          restriction).'
    bodyType: json
  test_request:
    body:
      query: best coffee maker
      limit: 1
  cost:
    type: per_success
    value: 0.0009
    currency: USD
    unit: call
    reported_charge:
      path: costUsd
      unit: usd
    source: rate_card_api
    source_url: https://api.getanyapi.com/v1/apis/google.search
    checked: '2026-09-08'
    confidence: verified
  docs_url: https://getanyapi.com/api/google/search
  note: Flat per request whatever the result count. `google.search_100` returns up to 100 ranked results
    for one flat charge and is cheaper past roughly 20 results. AnyAPI slug `google.search`. 1 source
    can serve it; the cheapest serves first and a failed attempt is retried on the next, up to a $0.0009
    ceiling per request. Every response reports its exact charge as `costUsd`, so `reported_charge` settles
    the real number rather than this estimate. A request no source could serve is not charged. Send the
    `max_cost_usd` query parameter to refuse any source dearer than a price you name.
