  path: /v1/run/maps.search
  name: Google Maps Search
  summary: 'Search Google Maps for places matching a query and location: up to 20 normalized place records
    with ratings, addresses, and contact basics per request.'
  input:
    body:
      categoryFilterWords:
        type: array
        required: false
        note: Optional list of Google Maps place-category names to keep; results are limited to places
          whose category matches one of these. Use lowercase category names as shown on Google Maps (e.g.
          ["coffee shop", "restaurant"]). Omit to include all categories and stay on the cheapest price;
          a category...
      language:
        type: string
        required: false
        note: Two-letter language code for the results (e.g. en).
        default: en
      limit:
        type: integer
        required: false
        note: Maximum number of results to return (1-20, default 20). Pricing depends on the selected
          provider and may be flat per request.
        min: 1
        max: 20
        example: 1
      location:
        type: string
        required: true
        note: Free-text location to search in, ideally city plus country (e.g. Austin, USA).
        example: Austin, TX
      placeMinimumStars:
        type: string
        required: false
        note: 'Only return places with at least this average rating: two (2+), twoAndHalf (2.5+), three
          (3+), threeAndHalf (3.5+), four (4+), or fourAndHalf (4.5+). Places with no reviews are excluded.
          Omit this field to stay on the cheapest price; a rating floor routes to a dearer source.'
        enum:
        - two
        - twoAndHalf
        - three
        - threeAndHalf
        - four
        - fourAndHalf
      query:
        type: string
        required: true
        note: What you would type in the Google Maps search bar (e.g. coffee shop).
        example: coffee
      website:
        type: string
        required: false
        note: 'Filter places by whether they list a website: allPlaces (default), withWebsite (only places
          that have a website), or withoutWebsite (only places without one). Omit this field, or send
          allPlaces, to stay on the cheapest price; withWebsite and withoutWebsite route to a dearer source.'
        enum:
        - allPlaces
        - withWebsite
        - withoutWebsite
    bodyType: json
  test_request:
    body:
      query: coffee
      location: Austin, TX
      limit: 1
  cost:
    type: per_success
    value: 0.00175
    currency: USD
    unit: call
    reported_charge:
      path: costUsd
      unit: usd
    source: rate_card_api
