- id: anyapi.web.contents.get
  capability: web.contents.get
  platform: web
  scope: any_account
  kind: data
  method: POST
  path: /v1/run/web.scrape
  name: Web Scrape
  summary: Scrape any web page and get its content back as clean Markdown (or HTML, or raw HTML) plus
    title and metadata.
  input:
    body:
      blockAds:
        type: boolean
        required: false
        note: When true (upstream default), strip ad and cookie-consent elements before capture. Set false
          to keep them.
      excludeTags:
        type: array
        required: false
        note: CSS selectors to drop before capture (for example ["nav", "footer", ".ads"]). Applied after
          includeTags.
      formats:
        type: array
        required: false
        note: 'Which representations of the page to return. Any combination of: markdown (page content
          as Markdown), html (the page HTML exactly as the browser received it, including head and script
          tags). Each requested format is returned under the matching output field. Defaults to both.
          rawHtml is a...'
        default:
        - markdown
        - html
        example:
        - markdown
      includeTags:
        type: array
        required: false
        note: CSS selectors to keep. When set, only content matching these selectors is captured (for
          example ["article", "main"] or ["#content"]).
      mobile:
        type: boolean
        required: false
        note: When true, render the page with a mobile viewport and user agent instead of desktop. Some
          sites serve materially different content to mobile.
      onlyMainContent:
        type: boolean
        required: false
        note: When true, return only the main article content, stripping navigation, headers, footers,
          and other boilerplate. Defaults to false to capture the full page.
        default: false
        example: false
      url:
        type: string
        required: true
        note: The URL of the page to scrape.
        example: https://example.com
      waitFor:
        type: integer
        required: false
        note: Milliseconds to wait for the page to finish rendering before capture. Use this for JavaScript-heavy
          pages or single-page apps whose content loads after the initial paint. Capped at 15000 to stay
          within the request timeout. This wait is time you asked us to spend, so your response takes
          this much...
        min: 0
        max: 15000
    bodyType: json
  test_request:
    body:
      url: https://example.com
      formats:
      - markdown
  cost:
    type: per_success
    value: 0.0007
    currency: USD
    unit: call
    reported_charge:
      path: costUsd
      unit: usd
    source: rate_card_api
    source_url: https://api.getanyapi.com/v1/apis/web.scrape
    checked: '2026-09-08'
    confidence: verified
  docs_url: https://getanyapi.com/api/web/scrape
  note: Flat per request. Four sources; a blocked or empty fetch is retried on the next one, and the schema
    does not change. AnyAPI slug `web.scrape`. 4 sources can serve it; the cheapest serves first and a
    failed attempt is retried on the next, up to a $0.0015 ceiling per request. Every response reports
    its exact charge as `costUsd`, so `reported_charge` settles the real number rather than this estimate.
    A request no source could serve is not charged. Send the `max_cost_usd` query parameter to refuse
    any source dearer than a price you name.
- id: anyapi.google.serp.maps
  capability: google.serp.maps
  platform: google
